<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>I 18 anni rimandati</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Pixel art crisp: niente smoothing sul canvas */
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none; /* niente scroll/zoom da gesture sul gioco */
      }
      /* Precarica il font fuori schermo così è pronto per Phaser */
      .font-preload {
        position: absolute;
        left: -9999px;
        font-family: 'Press Start 2P', monospace;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <span class="font-preload">.</span>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
